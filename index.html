
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGenEval | Professional Institutional Grading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff9d;
            --dark-bg: #050505;
            --card-bg: #0f0f0f;
            --border-color: #1a1a1a;
        }

        body { 
          font-family: 'Inter', sans-serif; 
          background-color: var(--dark-bg);
          color: #ffffff;
          margin: 0;
          overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        #root {
          min-height: 100vh;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; color: black !important; }
            #root { width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .shadow-sm, .shadow-xl, .shadow-2xl { box-shadow: none !important; }
            .card-3d { border: 1px solid #eee !important; background: white !important; color: black !important; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--neon-green); border-radius: 10px; }

        .glass {
          background: rgba(10, 10, 10, 0.8);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-bottom: 1px solid var(--border-color);
        }

        .card-3d {
          background: var(--card-bg);
          border: 1px solid var(--border-color);
          box-shadow: 0 4px 20px rgba(0,0,0,0.5);
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-3d:hover {
          transform: translateY(-5px) scale(1.01);
          border-color: var(--neon-green);
          box-shadow: 0 10px 40px -10px rgba(0, 255, 157, 0.2);
        }

        .neon-glow {
          box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
        }
        
        .neon-text {
          color: var(--neon-green);
          text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
        }

        .btn-neon {
          background: var(--neon-green);
          color: #000;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          box-shadow: 0 0 15px rgba(0, 255, 157, 0.3);
          transition: all 0.2s ease;
        }
        
        .btn-neon:hover:not(:disabled) {
          box-shadow: 0 0 30px rgba(0, 255, 157, 0.6);
          transform: translateY(-2px);
        }

        .btn-neon:active:not(:disabled) {
          transform: translateY(1px);
        }

        .input-dark {
            background: #141414;
            border: 1px solid #222;
            color: white;
            transition: all 0.2s ease;
        }

        .input-dark:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 157, 0.1);
            outline: none;
        }

        @keyframes pulse-neon {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        .pulse-neon { animation: pulse-neon 2s infinite; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
