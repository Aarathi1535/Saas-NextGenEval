
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGenEval | Pro Institutional Grading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ff9d;
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1a1a1a;
            --glass: rgba(10, 10, 10, 0.7);
        }

        body { 
          font-family: 'Inter', sans-serif; 
          background-color: var(--bg);
          color: #ffffff;
          margin: 0;
          overflow-x: hidden;
          letter-spacing: -0.01em;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }
        
        #root {
          min-height: 100vh;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .card-3d { border: 1px solid #eee !important; background: white !important; color: black !important; box-shadow: none !important; }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 10px; }

        .glass-nav {
          background: var(--glass);
          backdrop-filter: blur(25px);
          -webkit-backdrop-filter: blur(25px);
          border-bottom: 1px solid var(--border);
        }

        .pro-card {
          background: var(--surface);
          border: 1px solid var(--border);
          box-shadow: 0 10px 40px -15px rgba(0,0,0,0.8);
          transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .pro-card:hover {
          transform: translateY(-4px);
          border-color: var(--neon);
          box-shadow: 0 20px 50px -20px rgba(0, 255, 157, 0.15);
        }

        .neon-glow {
          box-shadow: 0 0 25px rgba(0, 255, 157, 0.3);
        }
        
        .neon-text {
          color: var(--neon);
          text-shadow: 0 0 12px rgba(0, 255, 157, 0.4);
        }

        .btn-pro {
          background: var(--neon);
          color: #000;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: 0.12em;
          font-size: 0.75rem;
          transition: all 0.3s ease;
          border: 1px solid var(--neon);
        }
        
        .btn-pro:hover:not(:disabled) {
          background: transparent;
          color: var(--neon);
          box-shadow: 0 0 30px rgba(0, 255, 157, 0.2);
        }

        .btn-pro:active:not(:disabled) {
          transform: scale(0.97);
        }

        .input-pro {
            background: #0d0d0d;
            border: 1px solid var(--border);
            color: white;
            transition: all 0.2s ease;
        }

        .input-pro:focus {
            border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.1);
            outline: none;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(to bottom, transparent, var(--neon), transparent);
            opacity: 0.1;
            animation: scanline 4s linear infinite;
            pointer-events: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
